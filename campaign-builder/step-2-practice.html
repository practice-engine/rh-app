<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campaign Builder - Practice</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="campaign-builder.css" />
<script>window.CB_STEP = 1;</script>
</head>
<body>
  <div class="cb-shell">
    <h2 class="cb-panel-title"><span class="cb-panel-num">2</span>Practice Selection</h2>

    <label class="cb-label">Select Practice <span class="cb-req">*</span></label>
    <div class="cb-select-wrap">
      <select class="cb-select">
        <option>Charles County Dermatology Associates</option>
      </select>
    </div>

    <div class="cb-practice-card">
      <div class="cb-practice-head">
        <span class="cb-ph-icon">&#127970;&#65038;</span>
        <div>
          <h4>Charles County Dermatology Associates</h4>
          <span>Dermatology</span>
        </div>
      </div>
      <div class="cb-stat-row">
        <div class="cb-stat">
          <div class="cb-stat-top"><span class="cb-ico">&#128101;&#65038;</span>Eligible patients</div>
          <div class="cb-stat-vals"><span class="cb-dash">-</span></div>
        </div>
        <div class="cb-stat">
          <div class="cb-stat-top"><span class="cb-ico">&#9679;</span>Locations</div>
          <div class="cb-stat-vals">
            <span class="cb-v-active">Active: 1</span>
            <span class="cb-v-inactive">Inactive: 0</span>
          </div>
        </div>
        <div class="cb-stat">
          <div class="cb-stat-top"><span class="cb-ico">&#9787;&#65038;</span>Providers</div>
          <div class="cb-stat-vals">
            <span class="cb-v-active">Active: 16</span>
            <span class="cb-v-inactive">Inactive: 13</span>
          </div>
        </div>
      </div>
    </div>

    <div class="cb-foot">
      <a class="cb-btn-back" href="step-1-campaign-type.html">&#10094; Back</a>
      <a class="cb-btn-next" href="step-3-locations.html">Continue to Locations &#10230;</a>
    </div>
  </div>

  <script src="campaign-builder.js"></script>
</body>
</html>
